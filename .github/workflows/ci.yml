name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check all packages
        run: npx turbo run type-check

  expo-doctor:
    name: Expo Doctor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run expo doctor
        run: npx expo-doctor
        # Duplicate-package warnings are expected in an npm workspace monorepo
        # where hoisted and local installs can coexist; treat as advisory only.
        continue-on-error: true
